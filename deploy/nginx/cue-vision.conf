# nginx-конфиг cue-vision: фронт тренировок — статикой из /srv/cue-vision/training,
# /api — в сервис на 127.0.0.1:8080. Ставится в /etc/nginx/conf.d/cue-vision.conf.
#
# Домен в файле не хранится: server_name и пути к сертификату — в сниппете
# /etc/nginx/snippets/cue-vision-host.conf (образец — snippets/cue-vision-host.conf.example),
# в git он не добавляется. Порядок установки — deploy/README.md.

server {
    listen 443 ssl;
    http2 on;

    include /etc/nginx/snippets/cue-vision-host.conf;   # server_name + ssl_certificate*
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/cue-vision/training;

    # Пачки событий детектора: до MAX_BODY_BYTES сервиса (64 МБ по умолчанию).
    client_max_body_size 64m;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # По Host сервис сверяет Origin изменяющих запросов: без него вход даст 403.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Разбор большой пачки событий идёт до ответа.
        proxy_read_timeout 300s;
    }

    # Для внешнего мониторинга. /readyz (проверка базы) наружу не отдаём.
    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
    }

    # У файлов сборки Vite хеш в имени — кешируются навсегда.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # История браузера (createWebHistory): любой путь фронта отдаёт index.html,
    # и он всегда перепроверяется, чтобы после выкладки подтянулась новая сборка.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}

server {
    listen 80;
    include /etc/nginx/snippets/cue-vision-host.conf;
    return 301 https://$host$request_uri;
}
