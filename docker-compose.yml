services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cuevision
      POSTGRES_PASSWORD: cuevision
      POSTGRES_DB: cuevision
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Наружу только на localhost и не на 5432: он часто занят другой базой.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuevision -d cuevision"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://cuevision:cuevision@db:5432/cuevision?sslmode=disable
      API_TOKEN: ${API_TOKEN:-}
      DETECTORS: ${DETECTORS:-}
      AUTO_TRAINING: ${AUTO_TRAINING:-true}
      SKIP_EVENT_TYPES: ${SKIP_EVENT_TYPES:-positions}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    extra_hosts:
      # Детектор, запущенный на этой же машине, доступен как ws://host.docker.internal:8765.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  pgdata:
